/* Masonry: 3 columns, natural image heights */
.gal-grid {
  column-count: 3;

}
.gal-item {
  display: block;
  width: 100%;
  margin: 0 0 16px 0 !important;
  height: auto !important;
  min-height: 0 !important;
  background: transparent !important;
  border: none !important;
  line-height: 0;
  break-inside: avoid;
  -webkit-column-break-inside: avoid;
}
.gal-item img.gi-img {
  width: 100%;
  height: auto !important;
  display: block;
  object-fit: cover;
  border-radius: 16px;
  vertical-align: top;
}
@media (max-width: 850px) {
  .gal-grid { column-count: 2; }
}
@media (max-width: 520px) {
  .gal-grid { column-count: 1; }
}

.ph-gallery .ct { max-width: 1100px; }

<script>
const themeBtn=document.getElementById("themeBtn");
let theme=localStorage.getItem("kc-theme")||"dark";
document.documentElement.setAttribute("data-theme",theme);
themeBtn.textContent=theme==="dark"?"☀":"☾";
themeBtn.onclick=function(){theme=theme==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",theme);localStorage.setItem("kc-theme",theme);themeBtn.textContent=theme==="dark"?"☀":"☾"};
</script>

<script>
(function(){
  function setOrient(img){
    var item = img.closest(".gal-item");
    if(!item || !img.naturalWidth) return;
    item.classList.remove("gal-landscape","gal-portrait");
    item.classList.add(img.naturalWidth >= img.naturalHeight ? "gal-landscape" : "gal-portrait");
  }
  document.querySelectorAll(".gal-item img.gi-img").forEach(function(img){
    if(img.complete && img.naturalWidth) setOrient(img);
    else img.addEventListener("load", function(){ setOrient(img); });
  });
})();
</script>
